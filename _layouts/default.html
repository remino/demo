<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>{{ page.title }}</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="{{ '/site.css' | relative_url }}" />
		<link
			rel="stylesheet"
			href="{{ page.url | relative_url | append: 'style.css' }}"
		/>
		<script
			defer
			src="{{ page.url | relative_url | append: 'script.js' }}"
		></script>
		<link rel="stylesheet" href="https://remino.net/demokit/demokit.css" />
	</head>
	<body>
		{{ content }}
		<remino-ribbon pushbody position="bottom" border="top" bg="blur" autohide>
			<ul>
				<li><a href="./">{{page.title}}</a></li>
				<li>
					<a
						href="{{ site.github.repository_url }}/tree/main/{{ page.url | relative_url | split: '/' | shift | shift | join: '/' }}"
						target="_blank"
						>Source</a
					>
				</li>
				<li>
					<a href="../">Other Demos</a>
				</li>
			</ul>
		</remino-ribbon>
		<script src="https://remino.net/demokit/demokit.js"></script>
	</body>
</html>
